server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/promtail/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: inventory-app
    static_configs:
      - targets: [localhost]
        labels:
          job: inventory-app
          system: inventory
          __path__: /var/log/inventory-app/app.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            message: message
      - labels:
          level:
          event:
  - job_name: inventory-nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: inventory-nginx
          system: inventory
          __path__: /var/log/inventory-nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            status: status
