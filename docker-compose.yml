name: inventory-coursework
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inventory}
      MYSQL_USER: ${MYSQL_USER:-inventory_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?set in .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    security_opt: ["no-new-privileges:true"]

  app:
    build: ./app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-inventory}
      DB_USER: ${MYSQL_USER:-inventory_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - app_logs:/var/log/inventory
    networks: [application, data, observability]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - nginx_logs:/var/log/inventory
    networks: [entry, application, observability]
    depends_on:
      app: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 16M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    networks: [entry, data]
    depends_on:
      mysql: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]

  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?set in .env}
    networks: [data, observability]
    depends_on:
      mysql: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    networks: [observability]
    depends_on: [nginx]
    security_opt: ["no-new-privileges:true"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [observability]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [entry, observability]
    depends_on: [app, cadvisor, nginx-exporter, mysql-exporter]
    security_opt: ["no-new-privileges:true"]

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [observability]
    security_opt: ["no-new-privileges:true"]

  promtail:
    image: grafana/promtail:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app_logs:/var/log/inventory-app:ro
      - nginx_logs:/var/log/inventory-nginx:ro
      - promtail_positions:/tmp/promtail
    networks: [observability]
    depends_on: [loki]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_HTTP_PORT: 3000
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [entry, observability]
    depends_on: [prometheus, loki]
    security_opt: ["no-new-privileges:true"]

networks:
  entry:
  application:
    internal: true
  data:
    internal: true
  observability:
    internal: true
volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
  app_logs:
  nginx_logs:
