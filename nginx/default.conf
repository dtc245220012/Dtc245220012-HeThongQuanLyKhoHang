log_format inventory_json escape=json '{"time":"$time_iso8601","remote_ip":"$remote_addr","request":"$request","status":$status,"request_time":$request_time}';
access_log /var/log/inventory/access.log inventory_json;
error_log  /var/log/inventory/error.log warn;
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location = /metrics { return 404; }
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
server {
    listen 8081;
    server_name _;
    location = /stub_status { stub_status; access_log off; }
    location / { return 404; }
}
